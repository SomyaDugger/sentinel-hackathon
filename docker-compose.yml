version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentinel_postgres
    environment:
      POSTGRES_DB: sentinel_ivms
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: sentinel_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_ivms"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentinel.gov.in
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_network

volumes:
  pgdata:

networks:
  sentinel_network:
    driver: bridge
